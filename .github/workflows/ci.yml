name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: for f in plugin/Pathfinder/Route/*.lua plugin/Pathfinder/Route/Routes/*.lua; do luac5.1 -p "$f"; done
      - name: Tests
        run: lua5.1 tools/test_loc.lua
      - name: Package
        run: python3 -I tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: Pathfinder
          path: dist/*.zip
