name: Release

# Push a tag like v0.6; the plugin version in the ZIP is taken from it
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Tests
        run: lua5.1 tools/test_loc.lua
      - name: Package
        run: python3 -I tools/package.py --version "${GITHUB_REF_NAME#v}"
      - name: LotroInterface description
        run: python3 -I tools/readme_bbcode.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/lotrointerface.txt --title "Pathfinder ${GITHUB_REF_NAME#v}" --generate-notes
