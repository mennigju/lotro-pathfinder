name: Release

# Push a tag like v0.6; the plugin version in the ZIP is taken from it
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lua51
      - name: Tests
        run: lua5.1 tools/test_loc.lua
      - name: Package
        run: python3 -I tools/package.py --version "${GITHUB_REF_NAME#v}"
      - name: LotroInterface description
        run: python3 -I tools/readme_bbcode.py
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release made by hand on GitHub (which creates the tag) only gets the files
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/lotrointerface.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/lotrointerface.txt --title "Pathfinder ${GITHUB_REF_NAME#v}" --generate-notes
          fi
