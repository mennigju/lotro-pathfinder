name: Lua 5.1
description: Builds Lua 5.1.5 from source as lua5.1 and luac5.1, without apt

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/lua51"
        mkdir -p "$dir"
        curl -fsSL --retry 3 --max-time 60 -o "$dir/lua.tar.gz" https://www.lua.org/ftp/lua-5.1.5.tar.gz
        echo "2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333  $dir/lua.tar.gz" | sha256sum -c -
        tar xzf "$dir/lua.tar.gz" -C "$dir"
        # posix: no readline needed
        make -s -C "$dir/lua-5.1.5" posix
        make -s -C "$dir/lua-5.1.5" install INSTALL_TOP="$dir/install"
        ln -s lua "$dir/install/bin/lua5.1"
        ln -s luac "$dir/install/bin/luac5.1"
        echo "$dir/install/bin" >> "$GITHUB_PATH"
